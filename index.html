<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NEXUS AI</title><link rel="stylesheet" href="/style.css"></head><body><aside><div class="brand">NEXUS <span>AI</span></div><button class="newchat" onclick="location.href='/'">＋ New chat</button><div class="grow"></div><div id="me" class="account">Guest</div><button id="login" class="sidebtn" onclick="location.href='/login'">Sign in</button><button id="admin" class="sidebtn hide" onclick="location.href='/admin'">Admin</button></aside><main><header><span>NEXUS AI</span><span id="status"></span></header><section id="messages"><div class="hero"><div class="logoMark">N</div><h1>What can I help with?</h1><p>Ask anything. Write code. Attach an image or file.</p></div></section><div class="composerWrap"><div id="fileName"></div><form id="chat"><label class="attach" title="Attach file">＋<input id="file" type="file" accept="image/*,.txt,.md,.js,.ts,.jsx,.tsx,.json,.html,.css,.lua,.py,.sql,.xml,.yml,.yaml,.cfg,.ini,.log" hidden></label><textarea id="prompt" rows="1" placeholder="Message NEXUS AI"></textarea><button id="send" type="submit" aria-label="Send">↑</button></form><div class="hint">NEXUS AI can make mistakes. Check important information.</div></div></main><script src="/app.js"></script></body></html>
