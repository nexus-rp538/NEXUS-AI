<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin · NEXUS AI</title><link rel="stylesheet" href="/style.css"></head><body><main class="adminmain"><header><b>NEXUS AI · ADMIN</b><a href="/">Chat</a></header><div class="adminbox"><input id="q" placeholder="Search name or email"><button onclick="loadUsers()">Search</button><div id="users"></div></div></main><script>async function loadUsers(){let r=await fetch('/api/admin/users?q='+encodeURIComponent(q.value));if(r.status===403){location='/';return}let d=await r.json();users.innerHTML=d.map(u=>`<div class=user><img src="${u.avatar||''}"><span><b>${u.name||'User'}</b><small>${u.email||''} · ${u.role}</small></span><button onclick="role('${u.id}','ADMIN')">Admin</button><button onclick="role('${u.id}','USER')">User</button></div>`).join('')}async function role(id,role){await fetch('/api/admin/role',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({id,role})});loadUsers()}loadUsers()</script></body></html>
