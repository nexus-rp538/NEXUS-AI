<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Sign in · NEXUS AI</title>
  <link rel="stylesheet" href="/style.css">
  <style>
    .loginShell{min-height:100vh;display:grid;place-items:center;padding:24px;background:radial-gradient(circle at 50% 25%,rgba(124,58,237,.16),transparent 34%),#08080b;color:#fff}.loginCard{width:min(430px,92vw);padding:34px;border:1px solid #25252d;border-radius:24px;background:rgba(17,17,22,.94);box-shadow:0 24px 80px rgba(0,0,0,.45)}.loginLogo{width:54px;height:54px;border-radius:17px;display:grid;place-items:center;font-weight:900;font-size:22px;background:linear-gradient(135deg,#7c3aed,#8b5cf6,#60a5fa);margin-bottom:20px}.loginCard h1{margin:0 0 8px;font-size:28px}.loginCard p{color:#aaa;margin:0 0 24px}.oauth{display:flex!important;align-items:center;justify-content:center;gap:10px;width:100%;box-sizing:border-box;padding:14px 18px;border-radius:14px;text-decoration:none!important;background:#fff;color:#111!important;font-weight:700;margin:10px 0}.back{display:block;text-align:center;margin-top:18px;color:#aaa;text-decoration:none}.loginError{display:none;padding:13px 14px;margin:0 0 16px;border:1px solid rgba(239,68,68,.35);background:rgba(239,68,68,.08);border-radius:12px;color:#fca5a5;line-height:1.55}.small{font-size:12px;color:#777;text-align:center;margin-top:16px}
  </style>
</head>
<body style="margin:0">
  <div class="loginShell">
    <div class="loginCard">
      <div class="loginLogo">N</div>
      <h1>NEXUS AI</h1>
      <p id="subtitle">Sign in once and your chats stay with your account.</p>
      <div id="loginError" class="loginError"></div>
      <a class="oauth" href="/auth/google">G&nbsp;&nbsp; Continue with Google</a>
      <a class="back" href="/">← Back to NEXUS AI</a>
      <div class="small">Secure sign in · Your password is never shared with NEXUS AI</div>
    </div>
  </div>
<script>
  const p=new URLSearchParams(location.search),e=p.get('error'),box=document.getElementById('loginError');
  const msg={
    google_not_configured:'Google sign-in is not configured on the server yet.',
    google_callback:'Google could not finish signing you in. The Google OAuth callback / redirect URI needs to match the live NEXUS AI domain.',
    google_session:'Google signed you in, but NEXUS AI could not save the login session. Please try again.'
  };
  if(e){box.style.display='block';box.textContent=msg[e]||'Sign-in failed. Please try again.'}
</script>
</body>
</html>
